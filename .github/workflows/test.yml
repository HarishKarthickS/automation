name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: automation_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RUN_DB_TESTS: "true"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/automation_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/api test
      - run: pnpm --filter @automation/shared build
      - run: pnpm -C apps/api typecheck
      - name: Exercise encrypted backup and restore
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          pnpm -C apps/api exec tsx test/restore-fixture.ts seed
          docker exec "$PG_CONTAINER" pg_dump -U postgres -Fc automation_test > restore-test.dump
          docker exec "$PG_CONTAINER" createdb -U postgres automation_restore
          docker exec -i "$PG_CONTAINER" pg_restore -U postgres -d automation_restore < restore-test.dump
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/automation_restore pnpm -C apps/api exec tsx test/restore-fixture.ts verify

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @automation/shared build
      - run: pnpm -C apps/web typecheck
      - run: pnpm -C apps/web lint
      - run: pnpm -C apps/web build
      - run: pnpm -C apps/web exec playwright install --with-deps chromium
      - run: pnpm -C apps/web exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: apps/web/test-results

  sandbox:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: nodejs20
            image: node:22-bookworm-slim@sha256:3ed98443660ff48413b5af19ecefce3b9d50845a901a43420d47cc63a9fddbe9
          - runtime: python312
            image: python:3.12-slim-bookworm@sha256:5d9e6adc9abd558bc0ce05f9ab16cef71328916fc9728f6b81e337af86a737e2
          - runtime: cpp23
            image: gcc:14-bookworm@sha256:5e927c284bf55a7dc796262e311a0703344f62f41f5621eb56843111b1d37e15
          - runtime: java21
            image: eclipse-temurin:21-jdk-jammy@sha256:742daacb9316be4b6fc60258f6e4ac2a11882f6c597373c92290a57bfad0d2e0
          - runtime: go122
            image: golang:1.22-bookworm@sha256:3d699e4d15d0f8f13c9195c0632a16702b8cbdece2955af1c23b37ae5d55a253
          - runtime: rust183
            image: rust:1.83-slim-bookworm@sha256:540c902e99c384163b688bbd8b5b8520e94e7731b27f7bd0eaa56ae1960627ab
    env:
      EXECUTION_MODE: docker
      RUN_SANDBOX_TESTS: "true"
      SANDBOX_RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @automation/shared build
      - run: docker pull "$SANDBOX_IMAGE"
        env:
          SANDBOX_IMAGE: ${{ matrix.image }}
      - run: pnpm -C apps/api exec vitest run test/sandbox.integration.test.ts

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
